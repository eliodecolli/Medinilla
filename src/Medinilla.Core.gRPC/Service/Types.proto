syntax = "proto3";

option csharp_namespace = "Medinilla.Core.gRPC.Service";

import "Contracts/UserSetVariablesRequest.proto";

package medinilla.core.grpc;

message Error {
    bool has_error = 1;
    string message = 2;
}

message SetVariablesRequest {
    string client_identifier = 1;
    repeated UserSetVariablesRequest set_variable_data = 2;
}

message SetVariablesResponse {
    Error error = 1;
}
