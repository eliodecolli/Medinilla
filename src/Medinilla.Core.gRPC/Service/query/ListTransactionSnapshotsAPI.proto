syntax = "proto3";

option csharp_namespace = "Medinilla.Core.gRPC.Query";

import "Contracts/query/TransactionSnapshot.proto";

package medinilla.core.grpc.query;

message ListTransactionSnapshotsRequest {
    int32 offset = 1;
    int32 limit = 2;
}

message ListTransactionSnapshotsResponse {
    repeated TransactionSnapshot snapshots = 1;
}
