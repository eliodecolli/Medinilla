syntax = "proto3";

option csharp_namespace = "Medinilla.Core.gRPC.Service";

import "Contracts/ocpp/IdToken.proto";
import "Service/ocpp/Error.proto";

package medinilla.core.grpc;

message RequestStartTransactionRequest {
    string client_identifier = 1;
    optional int32 evse_id = 2;
    int32 remote_start_id = 5;
    
    string authorization_user_id = 6;
    int64 duration_seconds = 7;
}

message RequestStartTransactionResponse {
    IdToken token = 1;
    string correlation_id = 2;
    Error error = 3;
}
